<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1600px;height:900px;background:#0A1240;color:#F4F5F8;font-family:Archivo,system-ui,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:80px 80px}
.glow{position:absolute;width:900px;height:900px;right:-240px;top:-260px;background:radial-gradient(circle,rgba(74,106,232,.42),transparent 62%)}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:baseline;font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,245,248,.55)}
.metric{font-size:200px;line-height:.86;font-weight:800;letter-spacing:-.045em;color:#EDD947;font-stretch:110%}
.metric small{font-size:64px;font-weight:700;letter-spacing:-.02em}
h1{font-size:66px;line-height:.98;font-weight:700;letter-spacing:-.03em;margin-top:26px;max-width:15ch}
.sub{margin-top:20px;font-size:23px;color:rgba(244,245,248,.7);max-width:46ch;line-height:1.35}
.bot{display:flex;justify-content:space-between;align-items:flex-end}
.tag{font-family:"JetBrains Mono",monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,245,248,.45)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px}
.brand img{height:34px;width:auto}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span id="kicker">Case study</span><span id="year">2025</span></div>
  <div>
    <div class="metric" id="metric">3.92x</div>
    <h1 id="client">AUM Apparel</h1>
    <p class="sub" id="sub">Return on ad spend across eight months of Meta CPAS.</p>
  </div>
  <div class="bot">
    <span class="tag" id="tag">Paid media · Marketplace</span>
    <span class="brand">Hadona<sup style="font-size:12px">®</sup></span>
  </div>
</div>
<script>
var q=new URLSearchParams(location.search);
function set(id,k){var el=document.getElementById(id); if(q.get(k)) el.textContent=q.get(k);}
set('kicker','kicker'); set('year','year'); set('metric','metric'); set('client','client'); set('sub','sub'); set('tag','tag');
</script></body></html>
